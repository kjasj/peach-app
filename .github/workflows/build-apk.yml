name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: '是否直接发布为 GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: 构建并打包 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 配置 Gradle 缓存与运行环境
        uses: gradle/actions/setup-gradle@v4

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 执行单元测试与 Lint 静态分析
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: 配置 Release 签名密钥 (如配置了 Secrets)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/keystore/release.keystore" >> "$GITHUB_ENV"

      - name: 编译 Release 与 Debug APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 打包 APK 并计算 SHA256 校验和
        id: package
        run: |
          python3 tools/package_apk.py
          RELEASE_APK=$(ls dist/Peach-Android-*.apk | grep -v 'debug' | head -n 1 | xargs -n 1 basename || true)
          echo "release_apk=$RELEASE_APK" >> "$GITHUB_OUTPUT"
          echo "打包完成:"
          cat dist/SHA256SUMS

      - name: 上传构建产物 (GitHub Actions Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: peach-android-apks
          path: dist/
          retention-days: 30

      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          name: Peach Android ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
